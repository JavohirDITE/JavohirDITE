<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#13101d"/>
    </linearGradient>
    <linearGradient id="name" x1="60" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5b4fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
      <animate attributeName="x1" values="0;300;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .fade { opacity: 0; animation: fade 0.9s ease forwards; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .45s; }
      .d3 { animation-delay: .7s; } .d4 { animation-delay: .95s; }
      @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      text { dominant-baseline: auto; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="0" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="260" fill="url(#orb)">
    <animate attributeName="cx" values="1010;940;1010" dur="12s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200"/>
    <path d="M200 0 V300 M400 0 V300 M600 0 V300 M800 0 V300 M1000 0 V300"/>
  </g>

  <g class="fade d1" transform="translate(64 92)">
    <rect width="150" height="26" rx="13" fill="#1a1726" stroke="#2a2540"/>
    <circle cx="18" cy="13" r="4" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="32" y="17" font-size="12" fill="#9b9ba6">Available for work</text>
  </g>

  <text x="64" y="160" class="fade d2" font-size="56" font-weight="800" fill="url(#name)">Javohir Zokirjonov</text>
  <text x="66" y="196" class="fade d3" font-size="22" font-weight="600" fill="#c7c7d1">Fullstack Developer</text>
  <text x="66" y="224" class="fade d3" font-size="15" fill="#8b8b99">I build fast, type-safe products end to end — from schema to pixels.</text>

  <g class="fade d4" transform="translate(64 250)" font-size="13" font-weight="600">
    <g>
      <rect width="118" height="30" rx="15" fill="#12121f" stroke="#312e81"/>
      <circle cx="18" cy="15" r="4" fill="#818cf8"><animate attributeName="r" values="4;5.5;4" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="30" y="19" fill="#c7c7d1">Pulse</text>
    </g>
    <g transform="translate(130 0)">
      <rect width="118" height="30" rx="15" fill="#160f0a" stroke="#7c2d12"/>
      <circle cx="18" cy="15" r="4" fill="#fb923c"><animate attributeName="r" values="4;5.5;4" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text x="30" y="19" fill="#d6cdbf">Forge</text>
    </g>
    <g transform="translate(260 0)">
      <rect width="118" height="30" rx="15" fill="#160f1f" stroke="#4c1d95"/>
      <circle cx="18" cy="15" r="4" fill="#c084fc"><animate attributeName="r" values="4;5.5;4" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="30" y="19" fill="#e9e5f2">Muse</text>
    </g>
  </g>
</svg>
